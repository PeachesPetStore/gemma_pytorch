[pytest]
# Pytest configuration for Gemma PyTorch

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    --tb=short
    # Show local variables in tracebacks
    -l
    # Coverage options (uncomment when pytest-cov is installed)
    # --cov=gemma
    # --cov-report=html
    # --cov-report=term-missing
    # --cov-branch
    # Strict markers - all markers must be registered
    --strict-markers
    # Show warnings
    -W default
    # Disable cacheprovider warnings
    -p no:cacheprovider

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for combined functionality
    slow: Tests that take a long time to run
    gpu: Tests that require GPU/CUDA
    tpu: Tests that require TPU/XLA
    multimodal: Tests for multimodal models
    quantization: Tests for quantized models
    requires_checkpoint: Tests that need model checkpoint files

# Minimum Python version
minversion = 3.8

# Test timeout (in seconds) - requires pytest-timeout
# timeout = 300

# Ignore certain directories
norecursedirs = .git .tox dist build *.egg .venv venv

# Capture method
capture = fd

# Log settings
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filterwarnings
filterwarnings =
    # Ignore specific deprecation warnings if needed
    # ignore::DeprecationWarning
    # Convert warnings to errors (uncomment when ready for strict mode)
    # error
