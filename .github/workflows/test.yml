name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']
        exclude:
          # Exclude some combinations to speed up CI
          - os: macos-latest
            python-version: '3.8'
          - os: windows-latest
            python-version: '3.8'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run linting
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 gemma --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 gemma --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run type checking
      run: |
        mypy gemma --ignore-missing-imports --no-strict-optional || true

    - name: Run unit tests
      run: |
        pytest tests/unit -v -m "unit and not (gpu or tpu or requires_checkpoint)"

    - name: Run integration tests
      run: |
        pytest tests/integration -v -m "integration and not (gpu or tpu or requires_checkpoint)"

    - name: Generate coverage report
      run: |
        pytest --cov=gemma --cov-report=xml --cov-report=term-missing -m "not (gpu or tpu or requires_checkpoint)"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
        fail_ci_if_error: false

  test-gpu:
    name: Test with GPU
    runs-on: ubuntu-latest
    # Only run GPU tests if you have self-hosted runners with GPU
    # Comment out if not available
    if: false  # Set to true when GPU runners are available

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run GPU tests
      run: |
        pytest tests -v -m gpu

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Check code formatting with black
      run: |
        black --check gemma tests

    - name: Check import sorting with isort
      run: |
        isort --check-only gemma tests

    - name: Run pylint
      run: |
        pylint gemma --disable=all --enable=E,F || true
